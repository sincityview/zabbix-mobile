name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet and test
        run: |
          go vet ./data/
          go test ./data/ -race

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build APK
        # ВАЖНО: не добавляйте сюда -ldflags со значением из нескольких слов
        # ("-s -w") и не задавайте -env GOFLAGS=-trimpath.
        # fyne-cross прокидывает linker-флаги ТОЛЬКО через переменную GOFLAGS и
        # оборачивает значение в кавычки, если в нём есть "=" (AppendEnv в
        # internal/command/docker.go). Многословное значение схлопывается в один
        # аргумент, и сборка падает на
        #   go: parsing $GOFLAGS: unknown flag -trimpath -ldflags
        #   flag provided but not defined: -ldflags
        # Стрип и trimpath по умолчанию уже даёт сам fyne: fyne-cross передаёт
        # `fyne package -release`, а тот добавляет `-ldflags -w` и `-trimpath`.
        run: |
          fyne-cross android \
            -app-id com.zabbix.android.monitor \
            -icon icon.png \
            -app-version "${{ steps.get_version.outputs.VERSION }}" \
            -app-build ${{ github.run_number }} \
            -tags no_emoji \
            -arch arm64 \
            -name zabbix

      - name: Show APK size
        run: |
          APK_PATH=$(find fyne-cross/dist -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH"
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | sort -k1 -n -r | head -8

      - name: Sign APK
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | tail -1)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR"
          APK_PATH=$(find fyne-cross/dist -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH"
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" zabbix-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --out "zabbix-$VERSION.apk" zabbix-aligned.apk
          $BUILD_TOOLS_DIR/apksigner verify "zabbix-$VERSION.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: zabbix-${{ steps.get_version.outputs.VERSION }}.apk
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
