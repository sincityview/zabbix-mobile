# JVM-аргументы Gradle-демона: AGP + Compose требуют заметно больше памяти,
# чем дефолтные 512 МБ (на раннере GitHub это частая причина OOM в R8).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX обязателен: без этого флага androidx-зависимости не собираются.
android.useAndroidX=true

# Не тянуть исходники R-классов всех библиотек — сборка быстрее.
android.nonTransitiveRClass=true
